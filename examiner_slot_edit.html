{% extends 'base.html' %}{% block title %}Edit Examination Slot{% endblock %}{% block content %}
<a href="{{ url_for('examiner_slots') }}">← My slots</a><div class="eyebrow mt-3">Slot management</div><h1 class="page-title">Edit slot #{{ slot.id }}</h1><p class="lead-text">{{ slot.exam_name }} · {{ slot.examiner_name }}</p>
<div class="panel"><div class="panel-body"><form method="post" class="row g-3"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="hidden" name="exam_id" value="{{ slot.exam_id }}">
<div class="col-md-4"><label class="form-label">Date</label><input type="date" name="slot_date" class="form-control" value="{{ slot.slot_date }}" required></div><div class="col-md-3"><label class="form-label">Start</label><input type="time" name="start_time" class="form-control" value="{{ slot.start_time }}" required></div><div class="col-md-3"><label class="form-label">End</label><input type="time" name="end_time" class="form-control" value="{{ slot.end_time }}" required></div><div class="col-md-2"><label class="form-label">Capacity</label><input type="number" name="capacity" min="1" class="form-control" value="{{ slot.capacity }}" required></div><div class="col-12"><button class="btn btn-utc">Save slot</button></div></form></div></div>{% endblock %}
