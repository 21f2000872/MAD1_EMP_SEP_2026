{% extends 'base.html' %}{% block title %}My Profile{% endblock %}{% block content %}
<div class="eyebrow">Student account</div><h1 class="page-title">My profile</h1><p class="lead-text">Keep your UTC class and batch information up to date.</p>
<div class="panel"><div class="panel-body"><form method="post" class="row g-3"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ current_user.name }}" required></div><div class="col-md-6"><label class="form-label">Email (read only)</label><input class="form-control" value="{{ current_user.email }}" readonly></div><div class="col-md-4"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ current_user.phone }}"></div><div class="col-md-4"><label class="form-label">Class</label><input class="form-control" name="class_name" value="{{ current_user.class_name }}"></div><div class="col-md-4"><label class="form-label">Batch</label><input class="form-control" name="batch" value="{{ current_user.batch }}"></div><div class="col-12"><button class="btn btn-utc">Save profile</button></div></form></div></div>{% endblock %}
