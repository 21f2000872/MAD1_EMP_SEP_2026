{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card panel"><div class="panel-body">
  <div class="eyebrow mb-2">Welcome back</div><h1 class="page-title mb-2">Sign in to UTC ExamOps</h1>
  <p class="muted">Access your assigned dashboard securely.</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" name="email" autocomplete="username" required></div>
    <div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn btn-utc w-100" type="submit">Sign in</button>
  </form>
  <p class="mt-4 mb-0 small muted">New student or examiner? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
