{% extends 'base.html' %}{% block title %}Edit Rubric{% endblock %}{% block content %}
<a href="{{ url_for('admin_rubrics',exam_id=rubric.exam_id) }}">← Back to rubric</a><h1 class="page-title mt-3">Edit {{ rubric.criterion_name }}</h1>
<div class="panel"><div class="panel-body"><form method="post" class="row g-3"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><div class="col-md-5"><label class="form-label">Criterion</label><input name="criterion_name" class="form-control" value="{{ rubric.criterion_name }}" required></div><div class="col-md-3"><label class="form-label">Maximum marks</label><input name="max_marks" class="form-control" type="number" step="0.1" min="0.1" value="{{ rubric.max_marks }}" required></div><div class="col-md-4"><label class="form-label">Weightage</label><input name="weightage" class="form-control" type="number" step="0.01" value="{{ rubric.weightage }}" required></div><div class="col-12"><label class="form-label">Description</label><input name="description" class="form-control" value="{{ rubric.description }}"></div><div class="col-12"><button class="btn btn-utc">Save rubric</button></div></form></div></div>
{% endblock %}
